[tool.poetry]
name = "codeminer"
version = "0.2.0"
description = "Python client for the CodeMiner clinical code API"
authors = ["Alasdair Warwick <alasdair.warwick.19@ucl.ac.uk>"]
license = "MIT"
readme = "README.md"
packages = [{include = "codeminer", from = "src"}]
keywords = ["clinical-codes", "healthcare", "medical-coding", "icd10", "snomed", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = ">=2.25.0"
pandas = ">=1.3.0"
rich = ">=12.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"
black = "*"
quartodoc = "*"
ipykernel = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running CodeMiner API",
]

[tool.black]
line-length = 88
target-version = ["py39"]
